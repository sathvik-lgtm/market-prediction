# Theme values are the dataviz skill's validated, colorblind-safety-checked
# palette (references/palette.md) -- not eyeballed. Dark mode uses its own
# documented steps, not an automatic flip of the light values.

[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#f9f9f7"
secondaryBackgroundColor = "#fcfcfb"
textColor = "#0b0b0b"
font = "sans-serif"
baseRadius = "medium"
borderColor = "rgba(11,11,11,0.10)"
showSidebarBorder = true
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#4a3aa7", "#e34948"]

[theme.dark]
backgroundColor = "#0d0d0d"
secondaryBackgroundColor = "#1a1a19"
textColor = "#ffffff"
primaryColor = "#3987e5"
borderColor = "rgba(255,255,255,0.10)"
chartCategoricalColors = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#008300", "#9085e9", "#e66767"]
