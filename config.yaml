paths:
  db_path: "data/market_pred.db"

price_ingestion:
  history_start: "2018-01-01"
  backfill_buffer_days: 5

news_ingestion:
  lookback_days: 29
  page_size: 100
  max_pages_per_ticker: 3
  max_requests_per_run: 90
  # Restrict to known Indian financial press. Without this, NewsAPI's /everything
  # search spans its entire 150,000+ source index (academic journals, product
  # listings, automotive reviews, etc.) and bare ticker symbols like "TCS" or
  # "INFY" collide with unrelated acronyms/product names in totally unrelated domains.
  domains:
    - moneycontrol.com
    - economictimes.indiatimes.com
    - livemint.com
    - business-standard.com
    - ndtvprofit.com
    - financialexpress.com
    - cnbctv18.com

sentiment:
  # Base checkpoint we fine-tune ourselves: BERT further pretrained on a large
  # financial corpus (10-K/8-K filings, earnings calls) but with no classification
  # head yet -- unlike ProsusAI/finbert, which is already fine-tuned on this same
  # dataset, so fine-tuning it again would be redundant.
  finbert_base_model: "yiyanghkust/finbert-pretrain"
  # Off-the-shelf, already-fine-tuned FinBERT, used only as an evaluation comparison
  # point (baseline vs off-the-shelf vs our fine-tuned model).
  finbert_pretrained_model: "ProsusAI/finbert"
  model_dir: "models/finbert_finetuned"
  phrasebank_repo: "gtfintechlab/financial_phrasebank_sentences_allagree"
  phrasebank_config: "5768"
  val_fraction: 0.1
  max_seq_length: 64
  train_batch_size: 8
  eval_batch_size: 16
  num_epochs: 4
  learning_rate: 0.00002
  seed: 42

modeling:
  model_dir: "models/direction_model"
  # Seed years of price history before the first walk-forward test fold, so
  # the earliest fold still trains on a reasonable amount of history.
  min_train_years: 2
  # Fraction held out as the test set for the small-sample sentiment ablation
  # (single chronological split, not multi-fold -- see README).
  sentiment_test_fraction: 0.3
  seed: 42
